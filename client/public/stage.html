<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Bar Chart — Givebar</title>
  <meta name="color-scheme" content="dark">
  <style>html{background:#07080a;color-scheme:dark}</style>
  <link rel="preload" href="/assets/fonts/brandon-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/brandon-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/brandon-black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css?v=6.1.0">
  <link rel="stylesheet" href="css/base.css?v=6.1.0">
  <link rel="stylesheet" href="css/components.css?v=6.1.0">
  <link rel="stylesheet" href="css/app.css?v=6.1.0">
  <style>
    /* =========================================================================
       Fullscreen Bar Chart (Direction B — Presentation Contrast)

       Audience-facing surface. This is the ONE screen that carries a richer
       treatment: lit bar, restrained glass panels, luminous figures.
       Operational screens stay flat.

       Runtime-set custom properties (see stage.js):
         --stage-bar / --stage-bar-lo / --stage-bar-hi / --stage-bar-peak
         --stage-glow / --stage-glow-soft
         --stage-ink / --stage-ink-dim
         --stage-font
       ========================================================================= */

    :root {
      --stage-bar: #d4a359;
      --stage-bar-lo: #8a6a33;
      --stage-bar-hi: #e8c68c;
      --stage-bar-peak: #fbedd2;
      --stage-glow: rgba(212, 163, 89, 0.28);
      --stage-glow-soft: rgba(212, 163, 89, 0.12);
      --stage-ink: #f4f5f6;
      --stage-ink-dim: #9ea1a8;
      --stage-font: var(--font-brandon);

      --bar-h: clamp(56px, 8.4vh, 104px);
      --thermo-w: clamp(84px, 8.6vw, 148px);
      --row-h: clamp(40px, 4.6vh, 62px);
      --row-gap: clamp(8px, 1.1vh, 16px);
      --logo-h: clamp(38px, 4.4vh, 62px);
      --stage-radius: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Projector canvas on the root too: matches the inline critical style in
         <head> so the first frame and every later frame are the same black. */
      background-color: #07080a;
    }

    body {
      background-color: #07080a;
      color: var(--stage-ink);
      font-family: var(--stage-font);
      -webkit-font-smoothing: antialiased;
      /* Every figure on this screen is read against another figure: the total
         against the goal, a milestone against the tick beside it. Tabular
         figures are set once here so no individual rule can forget them. */
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    /* ---- Background styles ------------------------------------------------ */
    body[data-bg-style="plain"] { background: #07080a; }
    body[data-bg-style="subtle-gradient"] {
      background: radial-gradient(ellipse 120% 90% at 50% 12%, #16181f 0%, #07080a 72%);
    }
    body[data-bg-style="vignette"] {
      background: radial-gradient(ellipse 90% 80% at 50% 50%, #131419 30%, #030304 100%);
    }

    #stage-canvas {
      width: 100%;
      height: 100%;
      padding: clamp(20px, 3.2vh, 46px) clamp(24px, 3.4vw, 72px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      row-gap: clamp(12px, 2vh, 32px);
      position: relative;
    }

    /* =========================================================================
       Header — logo slot, event title, live/status cluster
       ========================================================================= */
    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(16px, 2vw, 40px);
      min-height: var(--logo-h);
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: clamp(14px, 1.6vw, 28px);
      min-width: 0;
    }

    /* Logo area reserves its row height permanently so an absent, empty, or
       broken logo never changes the header's vertical rhythm. Only its width
       collapses, which keeps the title from sitting next to a visible hole. */
    .logo-slot {
      height: var(--logo-h);
      display: flex;
      align-items: center;
      flex-shrink: 0;
      overflow: hidden;
      transition: width var(--dur-conf) var(--ease-out);
    }

    .logo-slot[data-state="empty"],
    .logo-slot[data-state="error"] {
      width: 0;
      margin-right: calc(-1 * clamp(14px, 1.6vw, 28px));
    }

    .logo-slot[data-state="ready"] {
      width: auto;
      max-width: clamp(160px, 18vw, 340px);
    }

    .logo-slot img {
      height: var(--logo-h);
      max-width: clamp(160px, 18vw, 340px);
      object-fit: contain;
      display: block;
    }

    .event-title {
      margin: 0;
      font-size: clamp(1.45rem, 2.35vw, 3rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.015em;
      color: var(--stage-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .status-cluster {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.1vw, 20px);
      flex-shrink: 0;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(1rem, 1.15vw, 1.45rem);
      font-weight: 700;
      color: var(--stage-bar);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .live-indicator .pulse-dot {
      width: 0.62em;
      height: 0.62em;
      background: var(--stage-bar);
    }

    .live-indicator[data-state="stale"] { color: var(--stage-ink-dim); }

    .matching-banner,
    .paused-banner,
    .stage-degraded {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: var(--stage-radius);
      padding: 0.42em 0.9em;
      font-size: clamp(0.95rem, 1.05vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .matching-banner {
      background: rgba(212, 163, 89, 0.1);
      border: 1px solid var(--stage-bar);
      color: var(--stage-bar);
    }

    .paused-banner {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .stage-degraded {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--stage-ink-dim);
    }

    [hidden] { display: none !important; }

    /* =========================================================================
       Body — figure block, horizontal bar / vertical thermometer, message
       ========================================================================= */
    .stage-body {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(10px, 1.6vh, 26px);
    }

    .figure-block {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .figure-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: clamp(16px, 2.5vw, 56px);
      flex-wrap: nowrap;
    }

    .stage-odometer-text {
      --odo-ink: var(--stage-bar);
      --odo-sep: var(--stage-bar);
      font-size: clamp(4.5rem, 11.5vw, 14rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.035em;
      color: var(--stage-bar);
      text-shadow: 0 0 clamp(24px, 3vw, 64px) var(--stage-glow-soft);
    }

    .goal-display {
      display: flex;
      align-items: baseline;
      gap: 0.4em;
      font-size: clamp(1.4rem, 2.5vw, 3.1rem);
      font-weight: 700;
      color: var(--stage-ink);
      letter-spacing: -0.02em;
      padding-bottom: 0.18em;
      white-space: nowrap;
    }

    .goal-label {
      font-size: 0.62em;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--stage-ink-dim);
    }

    /* ---- Horizontal bar --------------------------------------------------- */
    .barh {
      padding-bottom: clamp(46px, 6vh, 84px);
    }

    .barh-shell,
    .thermo-shell {
      position: relative;
      border-radius: calc(var(--stage-radius) + 4px);
    }

    .barh-track {
      position: relative;
      width: 100%;
      height: var(--bar-h);
      border-radius: var(--stage-radius);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045) 0%, rgba(255, 255, 255, 0) 42%),
        #101116;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.65),
        0 0 clamp(30px, 3.4vw, 70px) -12px var(--stage-glow);
    }

    /* The fill is a full-width layer scaled on the X axis: a compositor-only
       transform, no per-frame layout. Corners are square so scaling cannot
       distort a radius; the track's own radius + overflow clips the ends. */
    .barh-fill {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform var(--dur-roll) var(--ease-out);
      background: linear-gradient(
        90deg,
        var(--stage-bar-lo) 0%,
        var(--stage-bar) 58%,
        var(--stage-bar-hi) 92%,
        var(--stage-bar-peak) 100%
      );
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 0 rgba(0, 0, 0, 0.28),
        inset 0 -14px 22px -14px rgba(0, 0, 0, 0.5);
      will-change: transform;
    }

    /* ---- Vertical thermometer --------------------------------------------- */
    .thermo {
      display: none;
      justify-content: center;
      height: 100%;
      min-height: 0;
    }

    .thermo-shell {
      height: 100%;
      width: var(--thermo-w);
    }

    .thermo-track {
      position: relative;
      height: 100%;
      width: 100%;
      border-radius: var(--stage-radius);
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0%, rgba(255, 255, 255, 0) 42%),
        #101116;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 2px 0 6px rgba(0, 0, 0, 0.65),
        0 0 clamp(30px, 3.4vw, 70px) -12px var(--stage-glow);
    }

    .thermo-fill {
      position: absolute;
      inset: 0;
      transform-origin: center bottom;
      transform: scaleY(0);
      transition: transform var(--dur-roll) var(--ease-out);
      background: linear-gradient(
        0deg,
        var(--stage-bar-lo) 0%,
        var(--stage-bar) 58%,
        var(--stage-bar-hi) 92%,
        var(--stage-bar-peak) 100%
      );
      box-shadow:
        inset 2px 0 0 rgba(255, 255, 255, 0.3),
        inset -1px 0 0 rgba(0, 0, 0, 0.28),
        inset -14px 0 22px -14px rgba(0, 0, 0, 0.5);
      will-change: transform;
    }

    /* ---- Single decaying glow pulse --------------------------------------- */
    .bar-pulse {
      position: absolute;
      inset: -5px;
      border-radius: calc(var(--stage-radius) + 5px);
      pointer-events: none;
      opacity: 0;
      box-shadow:
        0 0 0 2px var(--stage-glow),
        0 0 clamp(40px, 5vw, 110px) 6px var(--stage-glow);
      will-change: opacity, transform;
    }

    .bar-pulse[data-pulse="on"] {
      animation: barPulseDecay var(--dur-pulse) var(--ease-out) 1 both;
    }

    @keyframes barPulseDecay {
      0%   { opacity: 0;    transform: scale(1); }
      14%  { opacity: 1;    transform: scale(1.014); }
      100% { opacity: 0;    transform: scale(1); }
    }

    /* ---- Milestone markers ------------------------------------------------ */
    .milestones {
      position: absolute;
      pointer-events: none;
    }

    .milestones-h { left: 0; right: 0; top: 0; height: var(--bar-h); }
    .milestones-v { top: 0; bottom: 0; left: 0; width: 100%; }

    .mtick { position: absolute; }

    .milestones-h .mtick {
      top: 0;
      height: 100%;
      transform: translateX(-50%);
    }

    .milestones-v .mtick {
      left: 0;
      width: 100%;
      transform: translateY(50%);
    }

    .mtick-line {
      background: rgba(255, 255, 255, 0.2);
      transition: background-color var(--dur-ins) var(--ease-out);
    }

    .milestones-h .mtick-line { width: 2px; height: 100%; }
    .milestones-v .mtick-line { height: 2px; width: 100%; }

    .mtick[data-reached="1"] .mtick-line { background: rgba(0, 0, 0, 0.42); }

    .mtick-label {
      position: absolute;
      white-space: nowrap;
      font-size: clamp(0.95rem, 1.15vw, 1.5rem);
      font-weight: 500;
      letter-spacing: 0.05em;
      line-height: 1.15;
      transition: color var(--dur-ins) var(--ease-out);
      color: var(--stage-ink-dim);
    }

    .mtick[data-reached="1"] .mtick-label {
      color: var(--stage-bar);
      font-weight: 700;
    }

    .milestones-h .mtick-label {
      top: calc(100% + clamp(8px, 1vh, 14px));
      left: 50%;
      transform: translateX(-50%);
      align-items: center;
    }

    .milestones-h .mtick[data-edge="start"] .mtick-label {
      left: 0;
      transform: none;
      align-items: flex-start;
    }

    .milestones-h .mtick[data-edge="end"] .mtick-label {
      left: 100%;
      transform: translateX(-100%);
      align-items: flex-end;
    }

    .milestones-v .mtick-label {
      left: calc(100% + clamp(12px, 1vw, 22px));
      top: 50%;
      transform: translateY(-50%);
    }

    /* ---- Stage message ---------------------------------------------------- */
    .stage-message {
      font-size: clamp(1.25rem, 1.95vw, 2.6rem);
      font-weight: 500;
      line-height: 1.25;
      color: var(--stage-ink);
      letter-spacing: -0.005em;
      padding-top: clamp(2px, 0.6vh, 10px);
    }

    /* =========================================================================
       Bottom — recent donations feed + QR block (restrained glass)
       ========================================================================= */
    .stage-bottom-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(18px, 2.4vw, 44px);
      align-items: stretch;
    }

    .stage-panel {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(20px) saturate(115%);
      -webkit-backdrop-filter: blur(20px) saturate(115%);
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: var(--stage-radius);
      padding: clamp(14px, 1.9vh, 26px) clamp(16px, 1.6vw, 30px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      min-width: 0;
    }

    .panel-title {
      font-size: clamp(0.95rem, 1.15vw, 1.4rem);
      font-weight: 700;
      color: var(--stage-ink-dim);
      margin: 0 0 clamp(8px, 1.2vh, 16px) 0;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* Fixed-height viewport: the row count and row height never change, so an
       arriving donation cannot reflow anything below it. */
    .recent-viewport {
      height: calc(3 * var(--row-h) + 2 * var(--row-gap));
      overflow: hidden;
      position: relative;
    }

    .recent-feed-list {
      display: flex;
      flex-direction: column;
      gap: var(--row-gap);
      will-change: transform;
    }

    .recent-feed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(10px, 1.2vw, 22px);
      height: var(--row-h);
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.055);
    }

    .recent-feed-donor {
      font-size: clamp(1.05rem, 1.45vw, 1.9rem);
      font-weight: 500;
      color: var(--stage-ink);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-feed-amount {
      font-size: clamp(1.2rem, 1.7vw, 2.25rem);
      font-weight: 700;
      color: var(--stage-bar);
      letter-spacing: -0.02em;
    }

    /* Entering row: fades up into a slot that already exists at final size. */
    .recent-feed-item[data-enter="pending"] { opacity: 0; }
    .recent-feed-item { opacity: 1; transition: opacity var(--dur-conf) var(--ease-out); }

    .qr-block {
      display: flex;
      align-items: center;
      gap: clamp(16px, 1.8vw, 32px);
    }

    /* No white plate until the code actually loads, so a slow or missing QR
       never flashes a blank card at the room. */
    .qr-image-frame {
      width: clamp(104px, 11vh, 168px);
      height: clamp(104px, 11vh, 168px);
      padding: 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .qr-image-frame img {
      width: 100%;
      height: 100%;
      display: block;
      background: #ffffff;
    }

    .qr-image-frame img:not([src]) { display: none; }

    .qr-url-text {
      font-size: clamp(1.1rem, 1.55vw, 2.05rem);
      font-weight: 700;
      color: var(--stage-ink);
      letter-spacing: -0.01em;
      word-break: break-word;
      min-width: 0;
    }

    /* =========================================================================
       Layout reflow states — toggles must move layout, never leave holes
       ========================================================================= */
    #stage-canvas[data-layout="recent-only"] .stage-bottom-grid,
    #stage-canvas[data-layout="qr-only"] .stage-bottom-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    #stage-canvas[data-layout="recent-only"] #stage-qr-panel,
    #stage-canvas[data-layout="qr-only"] #stage-recent-panel {
      display: none;
    }

    #stage-canvas[data-layout="minimal"] .stage-bottom-grid { display: none; }
    #stage-canvas[data-layout="minimal"] { grid-template-rows: auto minmax(0, 1fr); }

    #stage-canvas[data-layout="minimal"] .stage-odometer-text {
      font-size: clamp(6rem, 15vw, 19rem);
    }
    #stage-canvas[data-layout="minimal"] .goal-display {
      font-size: clamp(1.8rem, 3.2vw, 4rem);
    }
    #stage-canvas[data-layout="minimal"] { --bar-h: clamp(72px, 11vh, 140px); }

    /* =========================================================================
       Vertical thermometer orientation
       ========================================================================= */
    body[data-orientation="vertical"] .barh { display: none; }
    body[data-orientation="vertical"] .thermo { display: flex; }

    body[data-orientation="vertical"] .stage-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(clamp(120px, 11vw, 220px), 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas:
        "figure thermo gutter"
        "message thermo gutter";
      column-gap: clamp(24px, 3vw, 64px);
      row-gap: clamp(8px, 1.2vh, 20px);
      align-items: center;
    }

    body[data-orientation="vertical"] .figure-block {
      grid-area: figure;
      justify-self: end;
      align-self: end;
      text-align: right;
      align-items: flex-end;
    }

    body[data-orientation="vertical"] .figure-row {
      flex-direction: column;
      align-items: flex-end;
      gap: clamp(4px, 0.8vh, 12px);
    }

    body[data-orientation="vertical"] .stage-odometer-text {
      font-size: clamp(3.5rem, 8vw, 11rem);
    }

    body[data-orientation="vertical"] .goal-display {
      padding-bottom: 0;
      font-size: clamp(1.3rem, 2.1vw, 2.7rem);
    }

    body[data-orientation="vertical"] .thermo { grid-area: thermo; align-self: stretch; }
    body[data-orientation="vertical"] .stage-message {
      grid-area: message;
      justify-self: end;
      text-align: right;
      max-width: 100%;
    }

    /* Portrait projector / pillar screen. Side by side, the figure column is
       only 352px wide at 1080x1920 while the odometer needs 490px, so six
       digits ran 101px off the left edge with 236px of unused gutter on the
       right. Portrait has height to spare, so the figure takes the full width
       above the tube and the milestone gutter keeps the row it needs. */
    @media (max-aspect-ratio: 1/1) {
      body[data-orientation="vertical"] { --thermo-w: clamp(110px, 22vw, 260px); }

      body[data-orientation="vertical"] .stage-body {
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "figure  figure figure"
          ".       thermo gutter"
          "message message message";
        row-gap: clamp(16px, 2.4vh, 40px);
      }

      body[data-orientation="vertical"] .figure-block,
      body[data-orientation="vertical"] .stage-message {
        justify-self: center;
        align-self: center;
        text-align: center;
      }

      body[data-orientation="vertical"] .figure-block { align-items: center; }
      body[data-orientation="vertical"] .figure-row { align-items: center; }

      body[data-orientation="vertical"] .stage-odometer-text {
        font-size: clamp(3rem, 13vw, 11rem);
      }

      body[data-orientation="vertical"] .stage-bottom-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* =========================================================================
       WYSIWYG edit mode — every affordance below is inert without ?edit=1,
       and the markup that carries it is injected by stage.js only in edit mode.
       ========================================================================= */
    [data-editable] {
      outline: 2px dashed rgba(212, 163, 89, 0.55);
      outline-offset: 6px;
      border-radius: 3px;
      cursor: text;
      transition: outline-color var(--dur-ack) var(--ease-out),
                  background-color var(--dur-ack) var(--ease-out);
    }

    [data-editable]:hover { outline-color: var(--stage-bar); background: rgba(212, 163, 89, 0.07); }
    [data-editable]:focus { outline: 2px solid var(--stage-bar); background: rgba(212, 163, 89, 0.1); }
    [data-editable][data-empty="1"]::before {
      content: attr(data-placeholder);
      color: var(--stage-ink-dim);
      font-style: italic;
    }

    .edit-bar {
      position: fixed;
      left: 50%;
      bottom: clamp(14px, 2vh, 28px);
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: clamp(10px, 1vw, 18px);
      background: rgba(18, 19, 23, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--stage-bar);
      border-radius: var(--stage-radius);
      padding: 10px 16px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.7);
      font-size: 15px;
    }

    .edit-bar-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--stage-bar);
      font-size: 13px;
    }

    .edit-bar-status {
      color: var(--stage-ink-dim);
      min-width: 15ch;
      font-size: 14px;
    }

    .edit-bar-status[data-tone="ok"] { color: #86efac; }
    .edit-bar-status[data-tone="err"] { color: #fca5a5; }

    .edit-btn {
      font: inherit;
      font-weight: 700;
      border-radius: 4px;
      padding: 9px 16px;
      cursor: pointer;
      border: 1px solid transparent;
      background: var(--stage-bar);
      color: #16130c;
      transition: filter var(--dur-ack) var(--ease-out);
    }

    .edit-btn:hover { filter: brightness(1.1); }
    .edit-btn[disabled] { opacity: 0.5; cursor: default; }

    .edit-btn.ghost {
      background: transparent;
      color: var(--stage-ink);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .edit-pin-input {
      font: inherit;
      background: #0c0d10;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      color: var(--stage-ink);
      padding: 8px 12px;
      width: 11ch;
      letter-spacing: 0.2em;
    }

    .fullscreen-hint {
      position: fixed;
      left: 50%;
      bottom: clamp(14px, 2vh, 28px);
      transform: translateX(-50%);
      z-index: 55;
      background: rgba(18, 19, 23, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--stage-radius);
      padding: 10px 18px;
      color: var(--stage-ink);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: opacity var(--dur-conf) var(--ease-out);
    }

    .fullscreen-hint[data-leaving="1"] { opacity: 0; }

    /* =========================================================================
       Reduced motion — same information, no spatial travel.
       These override the global kill switch in base.css on purpose: a
       cross-fade is the reduced equivalent, not the absence of feedback.
       ========================================================================= */
    @media (prefers-reduced-motion: reduce) {
      .barh-fill,
      .thermo-fill {
        transition: none !important;
      }

      .bar-pulse[data-pulse="on"] {
        animation: barPulseFade var(--dur-pulse) linear 1 both !important;
      }

      @keyframes barPulseFade {
        0%   { opacity: 0; }
        14%  { opacity: 1; }
        100% { opacity: 0; }
      }

      .recent-feed-list { transition: none !important; transform: none !important; }
      .recent-feed-item { transition: opacity var(--dur-ins) linear !important; }
      .logo-slot { transition: none !important; }
    }
  </style>
</head>
<body data-bg-style="plain" data-orientation="horizontal">

  <main id="stage-canvas" data-layout="full">

    <header class="stage-header">
      <div class="brand-cluster">
        <div id="stage-logo-slot" class="logo-slot" data-state="empty">
          <img id="stage-logo-img" src="" alt="">
        </div>
        <h1 id="stage-event-title" class="event-title">Givebar</h1>
      </div>

      <div class="status-cluster">
        <div id="stage-match-banner" class="matching-banner" hidden>
          <span id="stage-match-text">Gifts Matched</span>
        </div>

        <div id="stage-freeze-banner" class="paused-banner" hidden>Paused</div>

        <div id="stage-degraded-banner" class="stage-degraded" hidden>Locked</div>

        <div id="stage-live-indicator" class="live-indicator" data-state="live">
          <span class="pulse-dot"></span>
          <span class="live-label">Live</span>
        </div>
      </div>
    </header>

    <section class="stage-body" aria-label="Fundraising Progress">
      <div class="figure-block">
        <div class="figure-row">
          <div id="main-odometer" class="stage-odometer-text" role="img" aria-label="Total raised $0"></div>
          <div id="stage-goal-wrap" class="goal-display">
            <span class="goal-label">Goal</span>
            <span id="goal-amount-text">$500k</span>
          </div>
        </div>
      </div>

      <!-- Horizontal bar -->
      <div id="stage-bar-h" class="barh">
        <div class="barh-shell">
          <div class="barh-track" id="stage-bar-track">
            <div id="progress-bar-fill" class="barh-fill"></div>
          </div>
          <div id="stage-milestones-h" class="milestones milestones-h"></div>
          <div id="stage-bar-pulse" class="bar-pulse" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Vertical thermometer -->
      <div id="stage-thermo" class="thermo">
        <div class="thermo-shell">
          <div class="thermo-track" id="stage-thermo-track">
            <div id="thermo-bar-fill" class="thermo-fill"></div>
          </div>
          <div id="stage-milestones-v" class="milestones milestones-v"></div>
          <div id="stage-thermo-pulse" class="bar-pulse" aria-hidden="true"></div>
        </div>
      </div>

      <div id="stage-message-bar" class="stage-message" hidden></div>
    </section>

    <footer id="stage-bottom-section" class="stage-bottom-grid">
      <div id="stage-recent-panel" class="stage-panel">
        <h2 class="panel-title">Recent</h2>
        <div class="recent-viewport">
          <div id="recent-donations-feed" class="recent-feed-list"></div>
        </div>
      </div>

      <div id="stage-qr-panel" class="stage-panel">
        <h2 class="panel-title">Scan to Donate</h2>
        <div class="qr-block">
          <div class="qr-image-frame">
            <img id="stage-qr-img" src="" alt="Donation QR code">
          </div>
          <div id="stage-qr-url" class="qr-url-text"></div>
        </div>
      </div>
    </footer>

  </main>

  <script src="js/odometer.js?v=6.0.0"></script>
  <script src="js/stage.js?v=6.0.0"></script>
</body>
</html>
