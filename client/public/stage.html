<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Bar Chart — Givebar</title>
  <link rel="stylesheet" href="css/app.css?v=5.0.0">
  <style>
    /* =========================================================================
       Fullscreen Bar Chart (Direction B — Presentation Contrast)
       ========================================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090a0c;
      color: #f4f5f6;
      font-family: var(--font-sans);
    }

    /* Background Styles */
    body[data-bg-style="plain"] {
      background: #090a0c;
    }

    body[data-bg-style="subtle-gradient"] {
      background: radial-gradient(ellipse at 50% 25%, #161820 0%, #090a0c 100%);
    }

    body[data-bg-style="vignette"] {
      background: radial-gradient(ellipse at center, #121318 35%, #050507 100%);
    }

    #stage-canvas {
      width: 100vw;
      height: 100vh;
      max-width: 1920px;
      max-height: 1080px;
      padding: 3vh 4vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Top Navigation / Status Header */
    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 48px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--text-sm);
      font-weight: 700;
      color: #d4a359;
      letter-spacing: 0.04em;
    }

    .live-indicator .pulse-dot {
      width: 10px;
      height: 10px;
      background: #d4a359;
    }

    .logo-container {
      display: none;
      align-items: center;
    }

    .logo-container img {
      max-height: 44px;
      max-width: 180px;
      object-fit: contain;
      display: block;
    }

    .stage-message-line {
      font-size: var(--text-sm);
      color: #a1a4aa;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Middle / Hero Section: Total Raised + Progress Bar */
    .stage-centerpiece {
      width: 100%;
      display: flex;
      flex-direction: column;
      margin: auto 0;
      transition: all 0.3s ease;
    }

    .total-and-goal-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .total-raised-group {
      display: flex;
      flex-direction: column;
    }

    .total-raised-label {
      font-size: var(--text-base);
      font-weight: 600;
      color: #f4f5f6;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .stage-odometer-text {
      font-size: clamp(4.5rem, 8.5vw, 8rem);
      line-height: 1.05;
      font-weight: 900;
      color: #d4a359;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .stage-odometer-text .odometer-separator {
      color: inherit !important;
    }

    .goal-display {
      font-size: clamp(1.25rem, 2.2vw, 2rem);
      font-weight: 700;
      color: #d4a359;
      font-variant-numeric: tabular-nums;
      padding-bottom: 8px;
      letter-spacing: -0.01em;
    }

    /* Progress Bar */
    .progress-bar-wrap {
      width: 100%;
      position: relative;
      margin: 12px 0 6px 0;
    }

    .bar-track {
      width: 100%;
      height: 40px;
      background: #15161a;
      border: 1.5px solid #d4a359;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      background: #d4a359;
      border-radius: 9999px 0 0 9999px;
      transition: width 1000ms var(--ease-spring);
      width: 0%;
    }

    /* Milestones Scale Ticks */
    .milestones-scale {
      width: 100%;
      position: relative;
      height: 28px;
      margin-top: 4px;
    }

    .milestones-scale-axis {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #d4a359;
      opacity: 0.4;
    }

    .scale-tick {
      position: absolute;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      top: 0;
    }

    .scale-tick-line {
      width: 1px;
      height: 6px;
      background: #d4a359;
    }

    .scale-tick-label {
      font-size: var(--text-xs);
      color: #d4a359;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
      white-space: nowrap;
    }

    /* Bottom Section: Recent Donations + QR Code */
    .stage-bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 3vw;
      align-items: center;
      width: 100%;
      min-height: 160px;
      margin-top: auto;
      padding-top: 2vh;
    }

    .bottom-divider {
      background: #d4a359;
      opacity: 0.25;
      height: 100%;
      min-height: 130px;
    }

    .bottom-section-title {
      font-size: var(--text-base);
      font-weight: 700;
      color: #f4f5f6;
      margin: 0 0 14px 0;
      letter-spacing: 0.02em;
    }

    /* Recent Donations List */
    .recent-feed-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .recent-feed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .recent-feed-avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #d4a359;
      flex-shrink: 0;
    }

    .recent-feed-donor {
      font-size: var(--text-sm);
      font-weight: 600;
      color: #f4f5f6;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-feed-amount {
      font-size: var(--text-base);
      font-weight: 800;
      color: #d4a359;
      font-variant-numeric: tabular-nums;
    }

    /* QR Code + Link Block */
    .qr-block {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .qr-image-frame {
      width: 120px;
      height: 120px;
      background: #ffffff;
      padding: 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .qr-image-frame img {
      width: 100%;
      height: 100%;
      display: block;
    }
    #stage-canvas[data-layout="full"] .stage-bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
    }

    /* 2. Recent Only (QR off) */
    #stage-canvas[data-layout="recent-only"] .stage-bottom-grid {
      display: flex;
      justify-content: center;
    }
    #stage-canvas[data-layout="recent-only"] #stage-recent-panel {
      max-width: 600px;
      width: 100%;
    }
    #stage-canvas[data-layout="recent-only"] .bottom-divider,
    #stage-canvas[data-layout="recent-only"] #stage-qr-panel {
      display: none !important;
    }

    /* 3. QR Only (Recent off) */
    #stage-canvas[data-layout="qr-only"] .stage-bottom-grid {
      display: flex;
      justify-content: center;
    }
    #stage-canvas[data-layout="qr-only"] #stage-qr-panel {
      max-width: 600px;
      width: 100%;
    }
    #stage-canvas[data-layout="qr-only"] .bottom-divider,
    #stage-canvas[data-layout="qr-only"] #stage-recent-panel {
      display: none !important;
    }

    /* 4. Minimal Layout (Both Recent and QR off -> Center and Scale Up) */
    #stage-canvas[data-layout="minimal"] .stage-bottom-grid {
      display: none !important;
    }
    #stage-canvas[data-layout="minimal"] .stage-centerpiece {
      margin: auto 0;
      padding: 4vh 4vw;
    }
    #stage-canvas[data-layout="minimal"] .stage-odometer-text {
      font-size: clamp(6.5rem, 14vw, 11rem);
    }
    #stage-canvas[data-layout="minimal"] .total-raised-label {
      font-size: var(--text-xl);
    }
    #stage-canvas[data-layout="minimal"] .bar-track {
      height: 60px;
      border-width: 2px;
    }
    #stage-canvas[data-layout="minimal"] .goal-display {
      font-size: clamp(2rem, 3.5vw, 3rem);
    }
    .matching-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: #191712;
      border: 1px solid #d4a359;
      border-radius: var(--brand-radius);
      padding: 6px 14px;
      font-size: var(--text-xs);
      font-weight: 700;
      color: #d4a359;
      letter-spacing: 0.04em;
    }

    /* Paused Banner */
    .paused-banner {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      border-radius: var(--brand-radius);
      padding: 6px 12px;
      font-size: var(--text-xs);
      font-weight: 700;
      color: #ef4444;
      text-transform: uppercase;
    }
  </style>
</head>
<body data-bg-style="plain">

  <main id="stage-canvas" data-layout="full">

    <!-- Top Header -->
    <header class="stage-header">
      <div style="display: flex; align-items: center; gap: 24px;">
        <!-- Live Indicator -->
        <div id="stage-live-indicator" class="live-indicator">
          <span class="pulse-dot"></span>
          <span>Live</span>
        </div>

        <!-- Degraded Connection Notice -->
        <div id="stage-degraded-banner" class="degraded-banner" style="display: none;">
          <span>Reconnecting to server...</span>
        </div>
        <div id="stage-logo-wrap" class="logo-container">
          <img id="stage-logo-img" src="" alt="Event Logo">
        </div>

        <!-- Stage Message -->
        <div id="stage-message-bar" class="stage-message-line" style="display: none;"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 16px;">
        <!-- Matching Sponsor Banner -->
        <div id="stage-match-banner" class="matching-banner">
          <span id="stage-match-text">Matching Sponsor &bull; Double Your Impact</span>
        </div>

        <!-- Paused Screen Banner -->
        <div id="stage-freeze-banner" class="paused-banner">
          Display Paused
        </div>
      </div>
    </header>

    <!-- Centerpiece Hero: Total Raised + Rolling Odometer + Progress Bar -->
    <section class="stage-centerpiece" aria-label="Fundraising Progress">
      <div class="total-and-goal-row">
        <div class="total-raised-group">
          <span class="total-raised-label">Total Raised</span>
          <div id="main-odometer" class="stage-odometer-text"></div>
        </div>

        <div id="stage-goal-wrap" class="goal-display">
          Goal <span id="goal-amount-text">$500k</span>
        </div>
      </div>

      <!-- Horizontal Progress Bar Capsule -->
      <div class="progress-bar-wrap">
        <div class="bar-track" id="stage-bar-track">
          <div id="progress-bar-fill" class="bar-fill"></div>
        </div>
      </div>

      <!-- Milestone Markers (Scale Underneath) -->
      <div id="stage-milestones-scale" class="milestones-scale">
        <div class="milestones-scale-axis"></div>
        <!-- Ticks dynamically render here -->
      </div>
    </section>

    <!-- Bottom Lower Section: Recent Donations Feed & Scan to Donate Block -->
    <footer id="stage-bottom-section" class="stage-bottom-grid">
      <!-- Recent Donations List -->
      <div id="stage-recent-panel">
        <h2 class="bottom-section-title">Recent Donations</h2>
        <div id="recent-donations-feed" class="recent-feed-list">
          <!-- Recent 3 donation rows render here -->
        </div>
      </div>

      <!-- Vertical Divider -->
      <div class="bottom-divider"></div>

      <!-- Scan to Donate QR + URL Block -->
      <div id="stage-qr-panel">
        <h2 class="bottom-section-title">Scan to Donate</h2>
        <div class="qr-block">
          <div class="qr-image-frame">
            <img id="stage-qr-img" src="" alt="Donation QR Code">
          </div>
          <div id="stage-qr-url" class="qr-url-text">example.org/donate</div>
        </div>
      </div>
    </footer>

  </main>

  <script src="js/odometer.js?v=5.0.0"></script>
  <script src="js/stage.js?v=5.0.0"></script>
</body>
</html>
