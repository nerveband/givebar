<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Presenter View — Givebar</title>
  <link rel="stylesheet" href="css/app.css?v=5.0.0">
  <style>
    /* =========================================================================
       Presenter View (Direction B — b-presenter.png)
       Mobile-first design for 375px through desktop.
       ========================================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      background: #08080a; /* Deep near-black OLED surface */
      color: #f4f5f6;
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .presenter-shell {
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      padding: var(--space-4) var(--space-4) var(--space-6) var(--space-4);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      justify-content: space-between;
    }

    /* Minimal Top Bar */
    .presenter-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: var(--space-3);
      border-bottom: 1px solid #1f2026;
      margin-bottom: var(--space-4);
    }

    .presenter-title {
      font-size: var(--text-sm);
      font-weight: 700;
      color: #88888e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .presenter-nav-link {
      font-size: var(--text-xs);
      color: #88888e;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: var(--brand-radius);
      border: 1px solid #282932;
      background: #141519;
      transition: color 0.12s ease;
    }

    .presenter-nav-link:hover {
      color: #d4a359;
      border-color: #d4a359;
    }

    /* Primary Hero: Current Donor Name + Pronunciation + Amount */
    .presenter-hero-card {
      background: #101114;
      border: 1px solid #26272e;
      border-radius: var(--brand-radius);
      padding: var(--space-6) var(--space-4);
      text-align: center;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
    }

    .presenter-donor-name {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      color: #f4f5f6;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 10px 0;
      word-break: break-word;
      max-width: 100%;
    }

    /* Name Pronunciation directly beneath at >= 20px, not italicized */
    .presenter-pronunciation {
      font-size: clamp(20px, 3.2vw, 26px);
      font-weight: 500;
      font-style: normal; /* Explicitly NOT italicized per contract */
      color: #d4a359;
      letter-spacing: 0.01em;
      line-height: 1.3;
      margin: 0 0 18px 0;
      word-break: break-word;
      max-width: 100%;
    }

    /* Amount as secondary */
    .presenter-amount {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      color: #d4a359;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 10px 0;
    }

    .presenter-meta {
      font-size: var(--text-xs);
      color: #88888e;
      margin-top: 4px;
    }

    /* Compact Recent Donations List */
    .presenter-recent-section {
      background: #101114;
      border: 1px solid #26272e;
      border-radius: var(--brand-radius);
      padding: var(--space-4);
      margin-top: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .presenter-recent-header {
      font-size: var(--text-xs);
      font-weight: 700;
      color: #88888e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .presenter-recent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .presenter-recent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1a1b20;
      font-size: var(--text-sm);
      gap: var(--space-3);
    }

    .presenter-recent-row:last-child {
      border-bottom: none;
    }

    .presenter-recent-name {
      color: #f4f5f6;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .presenter-recent-amt {
      color: #d4a359;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Secondary Footer: Milestone distance & Total Raised (Never dominant) */
    .presenter-footer-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: #141519;
      border: 1px solid #232429;
      border-radius: var(--brand-radius);
      font-size: var(--text-xs);
      color: #88888e;
    }

    .metric-sub-val {
      color: #f4f5f6;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .metric-sub-val.gold {
      color: #d4a359;
    }

    @media (max-width: 480px) {
      .presenter-footer-metrics {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <div class="presenter-shell">

    <!-- Minimal Header -->
    <header class="presenter-top-bar">
      <div class="presenter-title">
        <span class="pulse-dot"></span>
        <span>Presenter View</span>
      </div>
      <div id="presenter-degraded-banner" class="degraded-banner" style="display: none;">
        <span>Reconnecting...</span>
      </div>
      <a href="/" class="presenter-nav-link">Home</a>
    </header>

    <!-- Primary Centerpiece: Current / Latest Donor -->
    <main class="presenter-hero-card" id="presenter-hero">
      <div id="presenter-donor-name" class="presenter-donor-name">
        Awaiting First Gift...
      </div>

      <!-- Name Pronunciation directly beneath at >= 20px, not italicized -->
      <div id="presenter-pronunciation" class="presenter-pronunciation" style="display: none;">
      </div>

      <!-- Amount as secondary -->
      <div id="presenter-amount" class="presenter-amount" style="display: none;">
        $0
      </div>

      <!-- Optional Table or Dedication Note -->
      <div id="presenter-meta" class="presenter-meta" style="display: none;">
      </div>
    </main>

    <!-- Compact Recent Donations List -->
    <section class="presenter-recent-section" aria-label="Recent Donations">
      <div class="presenter-recent-header">
        <span>Recent Donations</span>
        <span id="presenter-recent-count">0 gifts</span>
      </div>
      <div id="presenter-recent-list" class="presenter-recent-list">
        <div style="color: #88888e; font-size: var(--text-xs); padding: 8px 0; text-align: center;">
          Recent gifts will appear here live
        </div>
      </div>
    </section>

    <!-- Secondary Information at Bottom (Never dominant) -->
    <footer class="presenter-footer-metrics">
      <div>
        Next Milestone: <span id="presenter-milestone-text" class="metric-sub-val gold">Awaiting goal</span>
      </div>
      <div>
        Total Raised: <span id="presenter-total-raised" class="metric-sub-val">$0</span>
        (<span id="presenter-percent" class="metric-sub-val">0%</span> of <span id="presenter-goal" class="metric-sub-val">$500k</span>)
      </div>
    </footer>

  </div>

  <script src="js/emcee.js?v=5.0.0"></script>
</body>
</html>
