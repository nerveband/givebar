<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Bar Chart — Givebar</title>
  <meta name="color-scheme" content="dark">
  <style>html{background:#070603;color-scheme:dark}</style>
  <link rel="stylesheet" href="css/tokens.css?v=6.1.0">
  <link rel="stylesheet" href="css/base.css?v=6.1.0">
  <link rel="stylesheet" href="css/components.css?v=6.1.0">
  <link rel="stylesheet" href="css/app.css?v=6.1.0">
  <style>
    /* In-shell chart destination. The chart runs in an iframe at true projector
       geometry (1920x1080) and is scaled down with a transform, so the preview is
       pixel-faithful to the room. The iframe src is set once in markup and never
       touched again: it holds its own live connection and must not reload. */

    .preview-main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      gap: var(--space-4);
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
      flex-shrink: 0;
    }

    .preview-title {
      font-size: var(--text-2xl);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f4f5f6;
      margin: 0;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    /* --- Surface link hub. The panel is out of flow, so revealing it never
       moves page content. Identical markup, position, and behaviour on
       /preview, /donations, and /add; built by client/js/linkhub.js. --- */
    .linkhub {
      position: relative;
    }

    .lh-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 12px;
      background: #17181c;
      border: 1px solid #2a2c34;
      border-radius: 4px;
      color: #d8dade;
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
    }

    .lh-toggle:hover,
    .lh-toggle[aria-expanded="true"] {
      border-color: #d4a359;
      color: #ffffff;
    }

    .lh-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .lh-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 60;
      width: 340px;
      max-width: calc(100vw - 24px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      text-align: left;
      background: #101116;
      border: 1px solid #2a2c34;
      border-radius: 6px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .lh-panel[hidden] {
      display: none;
    }

    .lh-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lh-row[data-current="true"] {
      margin-left: -12px;
      padding-left: 10px;
      border-left: 2px solid #d4a359;
    }

    .lh-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      font-weight: 700;
      color: #f4f5f6;
    }

    .lh-url-wrap {
      display: flex;
      gap: 6px;
    }

    .lh-url {
      flex: 1;
      min-width: 0;
      background: #0a0b0e;
      border: 1px solid #2a2c34;
      border-radius: 4px;
      color: #d8dade;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 8px;
      outline: none;
    }

    .lh-url:focus {
      border-color: #d4a359;
    }

    .lh-copy {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 30px;
      padding: 0 10px;
      background: #202126;
      border: 1px solid #383a44;
      border-radius: 4px;
      color: #f4f5f6;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .lh-copy:hover {
      border-color: #d4a359;
    }

    .lh-copy.copied {
      border-color: #2f6b45;
      background: #16211a;
      color: #86efac;
    }

    .lh-copy.failed {
      border-color: #ef4444;
      background: #241414;
      color: #fca5a5;
    }

    .lh-status {
      font-size: 11px;
      font-weight: 700;
      color: #86efac;
    }

    .lh-status:empty {
      display: none;
    }

    .lh-note {
      margin: 0;
      font-size: 11px;
      color: #d4a359;
    }

    .btn-open {
      background: #d4a359;
      border: 1px solid #d4a359;
      color: #121316;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 800;
      padding: 8px 14px;
      min-height: 36px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-open:hover {
      background: #e5b842;
      border-color: #e5b842;
    }

    /* --- The embed --- */
    .preview-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .preview-frame {
      position: relative;
      background: #000000;
      border: 1px solid #2a2c34;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .chart-embed {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      border: 0;
      transform-origin: top left;
    }

    @media (max-width: 860px) {
      .preview-main {
        height: auto;
        overflow: visible;
      }
      .preview-stage {
        height: 56vw;
      }
    }
  </style>
</head>
<body>

  <div class="ops-shell">
    <!-- Left Navigation Sidebar -->
    <aside class="ops-sidebar">
      <div class="ops-brand">
        <div class="ops-brand-title">Givebar</div>
        <div class="ops-brand-sub">Live Gala Fundraising</div>
      </div>
      <nav class="ops-nav" aria-label="Main Navigation">
        <a href="/" class="ops-nav-item">Home</a>
        <a href="/preview" class="ops-nav-item active" aria-current="page">Fullscreen Bar Chart</a>
        <a href="/donations" class="ops-nav-item">Manage Donations</a>
        <a href="/add" class="ops-nav-item">Add Donation</a>
        <a href="/presenter" class="ops-nav-item">Presenter View</a>
        <a href="/settings" class="ops-nav-item">Settings</a>
        <a href="/testing" class="ops-nav-item">Testing</a>
        <a href="/history" class="ops-nav-item">History</a>
      </nav>
    </aside>

    <!-- Main Content Panel -->
    <main class="ops-main preview-main">
      <header class="preview-head">
        <h1 class="preview-title">Fullscreen Bar Chart</h1>
        <div class="preview-actions">
          <!-- The chart link lives in the hub with every other surface link, so
               there is exactly one place on this page to copy it. -->
          <div class="linkhub" data-linkhub data-linkhub-current="/chart">
            <button type="button" class="lh-toggle" data-linkhub-toggle aria-expanded="false" aria-controls="linkhub-panel" aria-label="Surface links">
              <svg class="lh-icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M137.54,186.36a8,8,0,0,1,0,11.31l-9.94,9.95a56,56,0,0,1-79.22-79.22l24.12-24.12A56,56,0,0,1,152,100.1a8,8,0,0,1-13,9.3,40,40,0,0,0-57.05-2.72L57.7,130.8a40,40,0,0,0,56.58,56.58l9.94-9.94A8,8,0,0,1,137.54,186.36Zm70.08-138a56.08,56.08,0,0,0-79.22,0l-9.94,9.95a8,8,0,0,0,11.31,11.31l9.95-9.94a40,40,0,0,1,56.58,56.58L172.18,140.4a40,40,0,0,1-57.06-2.71,8,8,0,0,0-13,9.3,56,56,0,0,0,84.66,3.72l24.12-24.12A56.08,56.08,0,0,0,207.62,48.38Z"/></svg>
              <span class="lh-toggle-text">Links</span>
            </button>
          </div>
          <a id="link-open-chart" class="btn-open" href="/chart" target="_blank" rel="noopener">
            <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="width:14px;height:14px;"><path d="M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z"/></svg>
            Open in new tab
          </a>
        </div>
      </header>

      <div class="preview-stage" id="preview-stage">
        <div class="preview-frame" id="preview-frame">
          <!-- src is authored here and never reassigned: the chart keeps its own
               live connection for the life of this page. No edit-mode parameter. -->
          <iframe
            id="chart-embed"
            class="chart-embed"
            src="/chart"
            title="Fullscreen Bar Chart, live"
            sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </main>
  </div>

  <script src="js/presence.js?v=6.1.1"></script>
  <script>
    (function () {
      'use strict';

      const BASE_W = 1920;
      const BASE_H = 1080;

      const stage = document.getElementById('preview-stage');
      const frame = document.getElementById('preview-frame');
      const embed = document.getElementById('chart-embed');
      const openLink = document.getElementById('link-open-chart');

      openLink.href = window.location.origin + '/chart';

      // Scale the projector-geometry iframe into whatever space the panel has.
      // Transform only — the document inside is never reloaded.
      let lastScale = 0;
      function fit() {
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        if (w <= 0 || h <= 0) return;
        const scale = Math.min(w / BASE_W, h / BASE_H);
        if (Math.abs(scale - lastScale) < 0.0005) return;
        lastScale = scale;
        frame.style.width = Math.round(BASE_W * scale) + 'px';
        frame.style.height = Math.round(BASE_H * scale) + 'px';
        embed.style.transform = 'scale(' + scale + ')';
      }

      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(fit).observe(stage);
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
  <script src="js/linkhub.js?v=6.1.0"></script>
</body>
</html>
