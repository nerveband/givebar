<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Bar Chart — Givebar</title>
  <link rel="stylesheet" href="css/app.css?v=6.0.0">
  <style>
    /* In-shell chart destination. The chart runs in an iframe at true projector
       geometry (1920x1080) and is scaled down with a transform, so the preview is
       pixel-faithful to the room. The iframe src is set once in markup and never
       touched again: it holds its own live connection and must not reload. */

    .preview-main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      gap: var(--space-4);
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
      flex-shrink: 0;
    }

    .preview-title {
      font-size: var(--text-2xl);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f4f5f6;
      margin: 0;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .link-url {
      width: 300px;
      max-width: 42vw;
      background: #101116;
      border: 1px solid #2a2c34;
      border-radius: 4px;
      color: #d8dade;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      padding: 8px 10px;
      outline: none;
    }

    .link-url:focus {
      border-color: #d4a359;
    }

    .btn-copy {
      background: #202126;
      border: 1px solid #383a44;
      color: #f4f5f6;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      padding: 8px 14px;
      min-height: 36px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-copy:hover {
      border-color: #d4a359;
      color: #ffffff;
    }

    .btn-copy.copied {
      border-color: #2f6b45;
      background: #16211a;
      color: #86efac;
    }

    .btn-copy.failed {
      border-color: #ef4444;
      background: #241414;
      color: #fca5a5;
    }

    .btn-open {
      background: #d4a359;
      border: 1px solid #d4a359;
      color: #121316;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 800;
      padding: 8px 14px;
      min-height: 36px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-open:hover {
      background: #e5b842;
      border-color: #e5b842;
    }

    .copy-status {
      flex-shrink: 0;
      min-height: 16px;
      font-size: var(--text-xs);
      font-weight: 700;
      color: #86efac;
    }

    /* --- The embed --- */
    .preview-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .preview-frame {
      position: relative;
      background: #000000;
      border: 1px solid #2a2c34;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .chart-embed {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      border: 0;
      transform-origin: top left;
    }

    @media (max-width: 860px) {
      .preview-main {
        height: auto;
        overflow: visible;
      }
      .preview-stage {
        height: 56vw;
      }
    }
  </style>
</head>
<body>

  <div class="ops-shell">
    <!-- Left Navigation Sidebar -->
    <aside class="ops-sidebar">
      <div class="ops-brand">
        <div class="ops-brand-title">Givebar</div>
        <div class="ops-brand-sub">Live Gala Fundraising</div>
      </div>
      <nav class="ops-nav" aria-label="Main Navigation">
        <a href="/" class="ops-nav-item">Home</a>
        <a href="/preview" class="ops-nav-item active" aria-current="page">Fullscreen Bar Chart</a>
        <a href="/donations" class="ops-nav-item">Manage Donations</a>
        <a href="/add" class="ops-nav-item">Add Donation</a>
        <a href="/presenter" class="ops-nav-item">Presenter View</a>
        <a href="/settings" class="ops-nav-item">Settings</a>
        <a href="/testing" class="ops-nav-item">Testing</a>
        <a href="/history" class="ops-nav-item">History</a>
      </nav>
    </aside>

    <!-- Main Content Panel -->
    <main class="ops-main preview-main">
      <header class="preview-head">
        <h1 class="preview-title">Fullscreen Bar Chart</h1>
        <div class="preview-actions">
          <input type="text" id="chart-url" class="link-url" readonly aria-label="Chart URL" value="/chart">
          <button type="button" id="btn-copy-chart" class="btn-copy">
            <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="width:14px;height:14px;"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg>
            <span id="copy-label">Copy link</span>
          </button>
          <a id="link-open-chart" class="btn-open" href="/chart" target="_blank" rel="noopener">
            <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="width:14px;height:14px;"><path d="M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z"/></svg>
            Open in new tab
          </a>
        </div>
      </header>

      <span id="copy-status" class="copy-status" aria-live="polite"></span>

      <div class="preview-stage" id="preview-stage">
        <div class="preview-frame" id="preview-frame">
          <!-- src is authored here and never reassigned: the chart keeps its own
               live connection for the life of this page. No edit-mode parameter. -->
          <iframe
            id="chart-embed"
            class="chart-embed"
            src="/chart"
            title="Fullscreen Bar Chart, live"
            sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      const BASE_W = 1920;
      const BASE_H = 1080;

      const stage = document.getElementById('preview-stage');
      const frame = document.getElementById('preview-frame');
      const embed = document.getElementById('chart-embed');
      const urlInput = document.getElementById('chart-url');
      const openLink = document.getElementById('link-open-chart');
      const copyBtn = document.getElementById('btn-copy-chart');
      const copyLabel = document.getElementById('copy-label');
      const copyStatus = document.getElementById('copy-status');

      const chartUrl = window.location.origin + '/chart';
      urlInput.value = chartUrl;
      openLink.href = chartUrl;

      // Scale the projector-geometry iframe into whatever space the panel has.
      // Transform only — the document inside is never reloaded.
      let lastScale = 0;
      function fit() {
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        if (w <= 0 || h <= 0) return;
        const scale = Math.min(w / BASE_W, h / BASE_H);
        if (Math.abs(scale - lastScale) < 0.0005) return;
        lastScale = scale;
        frame.style.width = Math.round(BASE_W * scale) + 'px';
        frame.style.height = Math.round(BASE_H * scale) + 'px';
        embed.style.transform = 'scale(' + scale + ')';
      }

      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(fit).observe(stage);
      }
      window.addEventListener('resize', fit);
      fit();

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) { /* fall through to selection copy */ }
        }
        const scratch = document.createElement('textarea');
        scratch.value = text;
        scratch.setAttribute('readonly', '');
        scratch.style.position = 'fixed';
        scratch.style.top = '-1000px';
        document.body.appendChild(scratch);
        scratch.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        document.body.removeChild(scratch);
        return ok;
      }

      copyBtn.addEventListener('click', async () => {
        const ok = await copyText(urlInput.value);
        copyBtn.classList.remove('copied', 'failed');
        copyBtn.classList.add(ok ? 'copied' : 'failed');
        copyLabel.textContent = ok ? 'Copied' : 'Copy failed';
        copyStatus.style.color = ok ? '#86efac' : '#fca5a5';
        copyStatus.textContent = ok ? 'Copied.' : 'Clipboard blocked. Select the link and copy it.';
        urlInput.focus();
        urlInput.select();
        setTimeout(() => {
          copyBtn.classList.remove('copied', 'failed');
          copyLabel.textContent = 'Copy link';
          copyStatus.textContent = '';
        }, 4000);
      });
    })();
  </script>
</body>
</html>
